name: Publish release verification report

on:
  repository_dispatch:
    types: [release-verification-ready]
  workflow_dispatch:
    inputs:
      version:
        description: "Published Alopex version to import (X.Y.Z); empty imports every pending report"
        required: false
        type: string
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: publish-release-verification
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish reports
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Import reports from Alopex CI
        id: reports
        env:
          REQUESTED_VERSION: ${{ github.event.inputs.version || github.event.client_payload.version || '' }}
        shell: bash
        run: |
          set -euo pipefail
          git remote add alopex https://github.com/alopex-db/alopex.git

          if [[ -n "${REQUESTED_VERSION}" ]]; then
            [[ "${REQUESTED_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            git fetch --force --quiet alopex \
              "+refs/heads/report/verify-release-v${REQUESTED_VERSION}-*:refs/remotes/alopex/report/verify-release-v${REQUESTED_VERSION}-*"
            mapfile -t refs < <(git for-each-ref \
              --format='%(refname)' "refs/remotes/alopex/report/verify-release-v${REQUESTED_VERSION}-*")
          else
            git fetch --force --quiet alopex \
              '+refs/heads/report/verify-release-v*:refs/remotes/alopex/report/verify-release-v*'
            mapfile -t refs < <(git for-each-ref \
              --format='%(refname)' 'refs/remotes/alopex/report/verify-release-v*')
          fi

          git fetch --force --quiet alopex \
            '+refs/tags/alopex-py-v*:refs/remotes/alopex/tags/alopex-py-v*'
          python3 scripts/import-release-reports.py --repo "${GITHUB_WORKSPACE}" \
            --version "${REQUESTED_VERSION}" \
            --manifest "${RUNNER_TEMP}/release-verification-hashes"

          if [[ -z "$(git status --porcelain -- reports/release-verification)" ]]; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Run public documentation checks
        if: steps.reports.outputs.changed == 'true'
        run: |
          python3 -m unittest discover -s scripts/tests -p test_import_release_reports.py
          bash scripts/check-public-surface.sh

      - name: Publish verified reports to main
        if: steps.reports.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/release-verification
          git commit -m "docs(release): publish verified release reports"
          git push origin HEAD:refs/heads/main

      - name: Verify published report bytes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          while IFS=$'\t' read -r report expected; do
            [[ -n "${report}" ]] || continue
            actual="$(git show "origin/main:${report}" | sha256sum | awk '{print $1}')"
            test "${actual}" = "${expected}"
            echo "verified ${report} (${actual})"
          done < "${RUNNER_TEMP}/release-verification-hashes"
