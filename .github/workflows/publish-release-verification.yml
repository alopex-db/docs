name: Publish release verification report

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Published Alopex version to import (X.Y.Z); empty imports every pending report"
        required: false
        type: string
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: publish-release-verification
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish reports
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Import reports from Alopex CI
        id: reports
        env:
          REQUESTED_VERSION: ${{ github.event.inputs.version || '' }}
        shell: bash
        run: |
          set -euo pipefail
          git remote add alopex https://github.com/alopex-db/alopex.git

          if [[ -n "${REQUESTED_VERSION}" ]]; then
            [[ "${REQUESTED_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            branch="report/verify-release-v${REQUESTED_VERSION}"
            git fetch --force --quiet alopex \
              "refs/heads/${branch}:refs/remotes/alopex/${branch}"
            refs=("refs/remotes/alopex/${branch}")
          else
            git fetch --force --quiet alopex \
              '+refs/heads/report/verify-release-v*:refs/remotes/alopex/report/verify-release-v*'
            mapfile -t refs < <(git for-each-ref \
              --format='%(refname)' 'refs/remotes/alopex/report/verify-release-v*')
          fi

          manifest="${RUNNER_TEMP}/release-verification-hashes"
          : > "${manifest}"
          if [[ "${#refs[@]}" -eq 0 ]]; then
            echo "No pending release reports"
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          for ref in "${refs[@]}"; do
            branch="${ref#refs/remotes/alopex/}"
            version="${branch#report/verify-release-v}"
            [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            report="reports/release-verification/v${version}.md"
            source_sha="$(git rev-parse "${ref}")"
            changed="$(git diff-tree --no-commit-id --name-only -r "${source_sha}")"
            test "${changed}" = "${report}"

            incoming="${RUNNER_TEMP}/v${version}.md"
            git show "${source_sha}:${report}" > "${incoming}"
            grep -Fxq "# リリース確認レポート: v${version}" "${incoming}"
            if ! grep -Fq '> 総合結果: **✅ 全ステップ成功**' "${incoming}" && \
               ! grep -Fq '> 総合結果: **❌ 失敗あり**' "${incoming}"; then
              echo "report has no exact overall result marker: ${report}" >&2
              exit 1
            fi
            install -D -m 0644 "${incoming}" "${report}"
            printf '%s\t%s\n' "${report}" "$(sha256sum "${incoming}" | awk '{print $1}')" \
              >> "${manifest}"
          done

          if [[ -z "$(git status --porcelain -- reports/release-verification)" ]]; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Run public documentation checks
        if: steps.reports.outputs.changed == 'true'
        run: bash scripts/check-public-surface.sh

      - name: Publish verified reports to main
        if: steps.reports.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/release-verification
          git commit -m "docs(release): publish verified release reports"
          git push origin main

      - name: Verify published report bytes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          while IFS=$'\t' read -r report expected; do
            [[ -n "${report}" ]] || continue
            actual="$(git show "origin/main:${report}" | sha256sum | awk '{print $1}')"
            test "${actual}" = "${expected}"
            echo "verified ${report} (${actual})"
          done < "${RUNNER_TEMP}/release-verification-hashes"
