name: Public Surface Check

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  public-surface:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check public surface contracts
        run: bash scripts/check-public-surface.sh
      - name: Check release report ingestion
        run: python3 -m unittest discover -s scripts/tests -p 'test_*release_reports.py'
      - name: Check measurement identity contracts (no benchmarks)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B -m unittest discover -s scripts/performance -p 'test_subject_identity.py' -v
      - name: Check manual supervisor contracts (tiny fake workers only)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B -m unittest discover -s scripts/performance -p 'test_supplemental_v0817.py' -v
      - name: Check SQL resource boundaries (tiny functional cases only)
        env:
          PYTHONDONTWRITEBYTECODE: 1
        working-directory: scripts/performance
        run: python3 -B -m unittest -v test_sql_resources test_write_kv_sql test_isolated_sql
